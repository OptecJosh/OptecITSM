; FreeITSM PHP configuration.
;
; The stock php:8.4-apache image ships PHP's conservative defaults — 8M POST
; bodies, 2M uploads, a 128M memory limit and 30 seconds of execution. Those are
; fine for serving pages and wrong for the bulk operations this application
; offers: a migration from another helpdesk arrives as a single 30 MB CSV, and
; parsing 23,000 rows of 258 columns peaks around 500 MB before anything is
; written. Under the defaults that fails as a bare "Network error", because the
; request is rejected or the process dies before any handler can report why.

; --- request size -----------------------------------------------------------
; The migration and mass-import screens POST the whole CSV as a JSON body, and
; JSON escaping inflates it, so post_max_size must comfortably exceed the largest
; file you expect. upload_max_filesize matters for attachments and LMS packages.
post_max_size = 128M
upload_max_filesize = 128M

; --- memory -----------------------------------------------------------------
; Headroom for parse + rewrite + plan on a large migration. Raise further only if
; you routinely load files bigger than ~50 MB; prefer splitting the file by date.
memory_limit = 1024M

; --- time -------------------------------------------------------------------
; A 20,000-row commit is one transaction and can legitimately take minutes. The
; cron entry points set their own limits; these are the web-request ceilings.
max_execution_time = 600
max_input_time = 600

; --- diagnostics ------------------------------------------------------------
; Errors go to the container log, never to the browser: a stack trace in an HTML
; response corrupts a JSON API reply and leaks paths.
display_errors = Off
log_errors = On
error_log = /dev/stderr
